<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelPlay • Automated Test Suite</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
    }
    .test-result-item {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
    }
    .test-result-item.pass {
      border-left: 4px solid var(--color-success);
    }
    .test-result-item.fail {
      border-left: 4px solid var(--color-danger);
    }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h1>🧪 PixelPlay Test Suite</h1>
    <a href="../index.html#/" class="btn btn-outline btn-sm">← Back to App</a>
  </div>
  <p style="margin-bottom: 1.5rem; color: var(--color-text-secondary);">
    Zero-dependency unit tests running directly in the browser environment.
  </p>
  <div id="test-results">
    <div class="empty-state">Running test suites...</div>
  </div>

  <script type="module">
    import { SimpleTestRunner } from './test-runner.js';
    import { empty, createElement } from '../js/utils/dom.js';

    const container = document.getElementById('test-results');
    const runner = new SimpleTestRunner();
    runner.runAll().then((results) => {
      empty(container);

      const passCount = results.filter(r => r.status === 'PASS').length;
      const failCount = results.filter(r => r.status === 'FAIL').length;

      const summaryCard = createElement('div', {
        className: 'stat-card',
        style: 'margin-bottom: 1.5rem;'
      }, [
        createElement('div', { className: 'stat-label', text: 'Test Summary' }),
        createElement('div', {
          className: 'stat-value',
          style: failCount === 0 ? 'color: var(--color-success);' : 'color: var(--color-danger);',
          text: `${passCount} / ${results.length} PASSED (${failCount} FAILED)`
        })
      ]);
      container.appendChild(summaryCard);

      results.forEach(res => {
        const item = createElement('div', {
          className: `test-result-item ${res.status === 'PASS' ? 'pass' : 'fail'}`
        }, [
          createElement('span', { text: res.name }),
          createElement('span', {
            className: `badge ${res.status === 'PASS' ? 'badge-secondary' : 'badge-danger'}`,
            text: res.status
          })
        ]);
        if (res.error) {
          item.appendChild(createElement('div', {
            style: 'color: var(--color-danger); font-size: 0.8rem; margin-top: 0.3rem;',
            text: res.error
          }));
        }
        container.appendChild(item);
      });
    });
  </script>
</body>
</html>
